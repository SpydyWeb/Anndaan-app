# Production stack for one Ubuntu VPS (2 vCPU / 4 GB).
#   cp .env.example .env   # fill in real values
#   docker compose up -d --build
# Only Caddy publishes ports (80/443). Postgres is reachable only on the internal network.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgis/postgis:17-3.5-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-annadaan}
      POSTGRES_USER: ${POSTGRES_USER:-annadaan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    command: >
      postgres
      -c shared_buffers=512MB
      -c effective_cache_size=1536MB
      -c work_mem=8MB
      -c maintenance_work_mem=128MB
      -c max_connections=60
      -c timezone=UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-annadaan}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-annadaan}
      UPLOAD_DIR: /data/uploads
      TRUST_PROXY_HEADERS: "true"
      RUN_JOBS: "true"
    volumes:
      - uploads:/data/uploads
    networks: [internal]
    logging: *logging

  caddy:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.caddy
    restart: unless-stopped
    depends_on: [api]
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?set ADMIN_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal]
    logging: *logging

  backup:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-annadaan}
      POSTGRES_USER: ${POSTGRES_USER:-annadaan}
    volumes:
      - backups:/backups
      - uploads:/data/uploads:ro
    networks: [internal]
    logging: *logging

volumes:
  pgdata:
  uploads:
  backups:
  caddy_data:
  caddy_config:

networks:
  internal:
