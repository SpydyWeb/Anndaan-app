# Local development database only (PostGIS on localhost:5433), for machines with Docker.
#   docker compose -f docker-compose.dev.yml up -d
services:
  db:
    image: postgis/postgis:17-3.5-alpine
    environment:
      POSTGRES_DB: annadaan
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - devdata:/var/lib/postgresql/data
      - ./infrastructure/dev-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
volumes:
  devdata:
